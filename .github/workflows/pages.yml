# テストを実行し、デフォルトブランチへの push 時に public/ を GitHub Pages へデプロイする
name: Test & Deploy to GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  cors-probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://enka.network/api/uid/618285856 https://enka.network/api/uid/618285856?info https://enka.network/api/uid/100000001; do
            echo "=== GET $u"
            curl -sS -m 30 -A "Mozilla/5.0" -H "Origin: https://mizugamiaqua.github.io" -D - -o body.json "$u" | sed -n '1,40p'
            head -c 300 body.json; echo
            echo "=== OPTIONS $u"
            curl -sS -m 30 -X OPTIONS -H "Origin: https://mizugamiaqua.github.io" -H "Access-Control-Request-Method: GET" -D - -o /dev/null "$u" | sed -n '1,30p'
          done
          echo "=== raw.githubusercontent CORS"
          curl -sS -I -H "Origin: https://example.com" https://raw.githubusercontent.com/mizugamiaqua/GenshinDPS/claude/blissful-volta-bj0yaz/README.md | grep -i -E "access-control|cache-control|HTTP/"
          echo "=== api.github.com CORS"
          curl -sS -I -H "Origin: https://example.com" https://api.github.com/repos/mizugamiaqua/GenshinDPS/contents/README.md | grep -i -E "access-control|cache-control|HTTP/|ratelimit"

  deploy:
    needs: test
    # デフォルトブランチへの push（または手動実行）の時だけデプロイ
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write site config
        env:
          ENKA_PROXY_URL: ${{ vars.ENKA_PROXY_URL }}
        run: node scripts/write-site-config.mjs public/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
